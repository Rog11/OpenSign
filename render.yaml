services:
  - type: web
    name: opensign-server
    env: docker
    plan: free

    image:
      url: opensign/opensignserver:main

    envVars:
      - key: NODE_ENV
        value: production

      - key: PUBLIC_URL
        value: https://your-app.onrender.com

      - key: SERVER_URL
        value: https://your-app.onrender.com/api/app

      - key: PARSE_MOUNT
        value: /api/app

      - key: MONGODB_URI
        sync: false

      - key: DO_SPACE
        sync: false

      - key: DO_ENDPOINT
        sync: false

      - key: DO_BASEURL
        sync: false

      - key: DO_ACCESS_KEY_ID
        sync: false

      - key: DO_SECRET_ACCESS_KEY
        sync: false

      - key: DO_REGION
        value: auto

      - key: USE_LOCAL
        value: "false"
