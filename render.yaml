services:
  - type: web
    name: opensign-server
    runtime: docker # ← changed from env
    plan: free

    image:
      url: opensign/opensignserver:main

    # Optional but recommended
    # dockerCommand: node server.js   # only if needed

    envVars:
      - key: NODE_ENV
        value: production

      - key: PUBLIC_URL
        value: "https://opensign-server.onrender.com" # ← update to your actual service name

      - key: SERVER_URL
        value: "https://opensign-server.onrender.com/api/app"

      - key: PARSE_MOUNT
        value: /api/app

      # Secrets / values you'll fill in the dashboard
      - key: MONGODB_URI
        sync: false

      - key: DO_SPACE
        sync: false

      - key: DO_ENDPOINT
        sync: false

      - key: DO_BASEURL
        sync: false

      - key: DO_ACCESS_KEY_ID
        sync: false

      - key: DO_SECRET_ACCESS_KEY
        sync: false

      - key: DO_REGION
        value: auto

      - key: USE_LOCAL
        value: "false"
