services:
  - type: web
    name: opensign-server
    env: docker
    plan: free

    image:
      url: opensign/opensignserver:main

    envVars:
      # ---- Core URLs ----
      - key: NODE_ENV
        value: production

      - key: PUBLIC_URL
        value: https://your-app.onrender.com

      - key: SERVER_URL
        value: https://your-app.onrender.com/api/app

      - key: PARSE_MOUNT
        value: /api/app

      # ---- Database ----
      - key: MONGODB_URI
        sync: false

      # ---- Cloudflare R2 ----
      - key: DO_SPACE
        sync: false

      - key: DO_ENDPOINT
        sync: false

      - key: DO_BASEURL
        sync: false

      - key: DO_ACCESS_KEY_ID
        sync: false

      - key: DO_SECRET_ACCESS_KEY
        sync: false

      - key: DO_REGION
        value: auto

      # ---- Storage mode ----
      - key: USE_LOCAL
        value: "false"

      # ---- SMTP (Mailgun sandbox) ----
      - key: SMTP_ENABLE
        value: "true"

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_USER_EMAIL
        sync: false

      - key: SMTP_PASS
        sync: false
